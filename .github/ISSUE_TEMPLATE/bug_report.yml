name: Bug report / 問題回報
description: Something doesn't work / 有東西不正常
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / 發生了什麼？
      description: What you did, what you expected, what you saw. A screenshot or screen recording helps a lot. / 你做了什麼、預期什麼、實際看到什麼；附截圖或錄影最有幫助。
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version / macOS 版本
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version / iOS 版本
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: How were you connected? / 你怎麼連線的？
      options:
        - LAN (same Wi-Fi) / 區網
        - Remote access (WireGuard) / 外網
    validations:
      required: true
  - type: checkboxes
    id: setup
    attributes:
      label: Setup / 環境
      options:
        - label: Screen & System Audio Recording and Accessibility are granted / 已授予螢幕與系統錄音、輔助使用
        - label: Multiple displays / 多螢幕
        - label: Signed with a free Apple ID / 用免費 Apple ID 簽章
